                    - img [ref=e1161]
                - paragraph [ref=e1163]: "It's very similar to Claude Code in terms of capability. Here are the key differences:"
                - list [ref=e1164]:
                  - listitem [ref=e1165]: 100% open source
                  - listitem [ref=e1166]:
                    - text: Not coupled to any provider. Although we recommend the models we provide through
                    - link "OpenCode Zen" [ref=e1167] [cursor=pointer]:
                      - /url: https://opencode.ai/zen
                    - text: ", OpenCode can be used with Claude, OpenAI, Google, or even local models. As models evolve, the gaps between them will close and pricing will drop, so being provider-agnostic is important."
                  - listitem [ref=e1168]: Out-of-the-box LSP support
                  - listitem [ref=e1169]:
                    - text: A focus on TUI. OpenCode is built by neovim users and the creators of
                    - link "terminal.shop" [ref=e1170] [cursor=pointer]:
                      - /url: https://terminal.shop
                    - text: ; we are going to push the limits of what's possible in the terminal.
                  - listitem [ref=e1171]: A client/server architecture. This, for example, can allow OpenCode to run on your computer while you drive it remotely from a mobile app, meaning that the TUI frontend is just one of the possible clients.
